<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESSCUP — Турнир</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем шрифты Google -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Шапка -->
    <header class="navbar">
        <div class="logo">
            <span class="star">✦</span> DESSCUP
        </div>
        <nav class="nav-links">
            <a href="#">Регистрация</a>
            <a href="#">FAQ</a>
            <a href="#">Регламент</a>
        </nav>
    </header>

    <!-- Главный блок (Hero) -->
    <section class="hero">
        <div class="hero-content">
            <h1>УЧАСТВУЙ В ТЕСТОВОМ<br><span class="highlight">ТУРНИРЕ</span></h1>
            <p class="subtitle">| Веселись. Играй. Побеждай.</p>
            <button class="btn-glow">Зарегистрироваться <span>→</span></button>
        </div>
        <div class="hero-image">
            <!-- Сюда можно вставить картинку кота. Пока используем заглушку -->
            <div class="placeholder-img">🐱 (Картинка кота)</div>
        </div>
    </section>

    <!-- Блок с джойстиком -->
    <section class="tournament">
        <div class="tournament-text">
            <p>Регистрация на турнир 5x5</p>
            <h2>ГОТОВЫ К БОЮ?</h2>
        </div>
        <div class="controller-icon">🎮</div>
    </section>
</body>
</html>
